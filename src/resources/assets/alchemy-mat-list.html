<style>

body {
	font-family: "Segoe UI", Arial, sans-serif;

	color: #ddd;
	padding: 24px;
}

h2 {
	color: #7fd4ff;
	margin-bottom: 10px;
}

input {
	width: 100%;
	padding: 8px;
	background: #111;
	border: 1px solid #333;
	color: #ddd;
	border-radius: 6px;
	margin-bottom: 10px;
}

input:focus {
	border-color: #6aa8ff;
	box-shadow: 0 0 6px #1f4aff55;
}

table {
	width: 100%;
	border-collapse: collapse;
}

th {
	cursor: pointer;
	background: #232323;
	color: #7fd4ff;
	border-bottom: 2px solid #444;
	padding: 8px;
}

td {
	padding: 6px 8px;
}

tbody tr:nth-child(even) { background:#181818; }
tbody tr:nth-child(odd) { background:#141414; }

tbody tr:hover { background:#222; }

thead th {
	position: sticky;
	top: 0;
}

td:first-child {
	text-align:right;
	font-family: monospace;
	color:#ffc36e;
}

td:nth-child(2){
	color:#8cffb5;
}

td:nth-child(4){
	color:#7caeff;
}

</style>
</head>

/* ---------- build table ---------- */


function renderTable() {

	const tbody = document.querySelector("#table tbody")
	tbody.innerHTML = ""

	materials.forEach(m => {

		let row = document.createElement("tr")

		row.innerHTML = `
<td>${m.id}</td>
<td>${m.material}</td>
<td>${m.item}</td>
<td>${m.source}</td>
<td>${m.notes || ""}</td>
`

		tbody.appendChild(row)

	})

}

renderTable()
validateMaterials()

function toggleMaterialCheck(){
	const div = document.getElementById('materialCheck')
	const btn = document.getElementById('toggleMaterialCheck')
	if(!div || !btn) return
	if(div.style.display === 'none'){
		div.style.display = ''
		btn.innerText = 'Hide Material Check'
	} else {
		div.style.display = 'none'
		btn.innerText = 'Show Material Check'
	}
}

/* ---------- search ---------- */

function filterTable(){

const query =
document.getElementById("search")
.value
.toLowerCase()

const rows =
document.querySelectorAll("#table tbody tr")

rows.forEach(row => {

const text =
row.innerText.toLowerCase()

row.style.display =
text.includes(query) ? "" : "none"

})

}

/* ---------- sorting ---------- */

function sortTable(column){

const table =
document.getElementById("table")

const tbody =
table.tBodies[0]

let rows =
Array.from(tbody.rows)

let asc =
table.getAttribute("data-sort-dir") !== "asc"

rows.sort((a,b)=>{

let x =
a.cells[column].innerText

let y =
b.cells[column].innerText

let nx =
Number(x)

let ny =
Number(y)

if(!isNaN(nx) && !isNaN(ny))
return asc ? nx-ny : ny-nx

return asc
? x.localeCompare(y)
: y.localeCompare(x)

})

table.setAttribute(
"data-sort-dir",
asc ? "asc" : "desc"
)

rows.forEach(r => tbody.appendChild(r))

}

function validateMaterials(){

const ids = materials.map(m => m.id)

const unique = new Set(ids)

let missing = []

for(let i=1;i<=50;i++){
 if(!unique.has(i)) missing.push(i)
}

const duplicates =
ids.filter((v,i,a)=>a.indexOf(v)!==i)

const div =
document.getElementById("materialCheck")

div.innerHTML = `
Total entries: ${materials.length}<br>
Unique materials: ${unique.size}/50<br>
Missing IDs: ${missing.length ? missing.join(", ") : "None"}<br>
Duplicate IDs: ${duplicates.length ? duplicates.join(", ") : "None"}
`
}
