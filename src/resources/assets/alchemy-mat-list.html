/* ---------- build table ---------- */

function renderTable() {

const tbody = document.querySelector("#table tbody")
tbody.innerHTML = ""

materials.forEach(m => {

let row = document.createElement("tr")

row.innerHTML = `
<td>${m.id}</td>
<td>${m.material}</td>
<td>${m.item}</td>
<td>${m.source}</td>
<td>${m.notes || ""}</td>
`

tbody.appendChild(row)

})

}

renderTable()
validateMaterials()

/* ---------- search ---------- */

function filterTable(){

const query =
document.getElementById("search")
.value
.toLowerCase()

const rows =
document.querySelectorAll("#table tbody tr")

rows.forEach(row => {

const text =
row.innerText.toLowerCase()

row.style.display =
text.includes(query) ? "" : "none"

})

}

/* ---------- sorting ---------- */

function sortTable(column){

const table =
document.getElementById("table")

const tbody =
table.tBodies[0]

let rows =
Array.from(tbody.rows)

let asc =
table.getAttribute("data-sort-dir") !== "asc"

rows.sort((a,b)=>{

let x =
a.cells[column].innerText

let y =
b.cells[column].innerText

let nx =
Number(x)

let ny =
Number(y)

if(!isNaN(nx) && !isNaN(ny))
return asc ? nx-ny : ny-nx

return asc
? x.localeCompare(y)
: y.localeCompare(x)

})

table.setAttribute(
"data-sort-dir",
asc ? "asc" : "desc"
)

rows.forEach(r => tbody.appendChild(r))

}

function validateMaterials(){

const ids = materials.map(m => m.id)

const unique = new Set(ids)

let missing = []

for(let i=1;i<=50;i++){
 if(!unique.has(i)) missing.push(i)
}

const duplicates =
ids.filter((v,i,a)=>a.indexOf(v)!==i)

const div =
document.getElementById("materialCheck")

div.innerHTML = `
Total entries: ${materials.length}<br>
Unique materials: ${unique.size}/50<br>
Missing IDs: ${missing.length ? missing.join(", ") : "None"}<br>
Duplicate IDs: ${duplicates.length ? duplicates.join(", ") : "None"}
`
}
