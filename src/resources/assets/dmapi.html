<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dark Mists API – dmapi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --bg: #0f1216;
    --panel: #151a21;
    --border: #262c36;
    --text: #d6dbe3;
    --muted: #9aa3af;
    --accent: #6ea8fe;
    --code: #0b0e13;
    --dir-in:  #4ade80;
    --dir-out: #fb923c;
    --dir-sys: #a78bfa;
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    padding: 2rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #121722, #0f1216);
  }

  header h1 {
    margin: 0;
    font-size: 1.8rem;
  }

  header p {
    margin-top: 0.25rem;
    color: var(--muted);
  }

  main {
    max-width: 1100px;
    margin: auto;
    padding: 2rem;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 2rem;
  }

  nav {
    position: sticky;
    top: 1rem;
    align-self: start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    font-size: 0.9rem;
  }

  nav h3 {
    margin-top: 0;
    font-size: 1rem;
  }

  nav ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }

  nav li {
    margin: 0.25rem 0;
  }

  nav a {
    color: var(--muted);
    text-decoration: none;
  }

  nav a:hover {
    color: var(--accent);
  }

  section {
    margin-bottom: 3rem;
  }

  h2 {
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.4rem;
  }

  .event {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin: 0.75rem 0;
  }

  .event-name {
    color: var(--accent);
    font-weight: 600;
    font-family: ui-monospace, monospace;
  }

  .event-desc {
    color: var(--muted);
    margin-top: 0.25rem;
  }

  .event-payload {
    margin-top: 0.6rem;
    background: var(--code);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 0.75rem;
    color: var(--text);
    font-family: ui-monospace, monospace;
    font-size: 0.8rem;
    white-space: pre-wrap;
    line-height: 1.4;
  }

  .event-dir {
    display: inline-block;
    font-size: 0.6rem;
    font-family: ui-monospace, monospace;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    vertical-align: middle;
    margin-left: 0.5rem;
    text-transform: uppercase;
  }
  .event-dir.in  { background: rgba(74,222,128,0.1);  color: var(--dir-in);  border: 1px solid rgba(74,222,128,0.25); }
  .event-dir.out { background: rgba(251,146,60,0.1);  color: var(--dir-out); border: 1px solid rgba(251,146,60,0.25); }
  .event-dir.sys { background: rgba(167,139,250,0.1); color: var(--dir-sys); border: 1px solid rgba(167,139,250,0.25); }

  code {
    background: var(--code);
    padding: 0.15rem 0.4rem;
    border-radius: 5px;
    font-family: ui-monospace, monospace;
    font-size: 0.85rem;
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 1.5rem;
    text-align: center;
    color: var(--muted);
  }
</style>
</head>

<body>

<header>
  <h1>Dark Mists API (dmapi)</h1>
  <p>Version 2.0.1 · Event-driven state API for Dark Mists MUD</p>
</header>

<main>
  <nav>
    <h3>Contents</h3>
    <ul id="toc"></ul>

</main>

<footer>
  dmapi · mudzereli · Designed for extensibility, not automation

  "dmapi.communication.newbiechanneldiscord": "{\n  sender: string,\n  message: string,\n  line: string\n}",
  "dmapi.communication.housechannel": "{\n  sender: string,\n  receiver: string,\n  message: string,\n  line: string\n}",

  "dmapi.player.currency.update": "{\n  gold: number,\n  silver: number,\n  experience: number,\n  experienceToLevel: number,\n  line: string\n}",
  "dmapi.player.currency.gain": "{\n  silver: number,\n  gold: number,\n  source: string,\n  line: string\n}",
  "dmapi.player.bank.balance": "{\n  gold: number,\n  silver: number,\n  line: string\n}",
  "dmapi.player.bank.deposit": "{\n  amount: number,\n  currency: string,\n  line: string\n}",
  "dmapi.player.bank.withdraw": "{\n  amount: number,\n  currency: string,\n  fee: number,\n  feeCurrency: string,\n  total: number,\n  line: string\n}",
  "dmapi.player.bank.withdraw.fail": "{\n  line: string\n}",
  "dmapi.player.house.balance": "{\n  gold: number,\n  line: string\n}",
  "dmapi.player.clan.balance": "{\n  gold: number,\n  line: string\n}",
  "dmapi.player.experience.gain": "{\n  amount: number,\n  total: number,\n  tnl: number,\n  line: string\n}",
  "dmapi.player.skill.improved": "{\n  skill: string,\n  line: string\n}",
  "dmapi.player.equipment.zapped": "{\n  item: string,\n  line: string\n}"
};

/* ============================================================================
   RENDERING
   ============================================================================ */

const toc = document.getElementById("toc");
const content = document.getElementById("content");

for (const [key, domain] of Object.entries(dmapi.domains)) {
  const id = `section-${key}`;

  // TOC
  const li = document.createElement("li");
  li.innerHTML = `<a href="#${id}">${domain.title}</a>`;
  toc.appendChild(li);

  // Section
  const section = document.createElement("section");
  section.id = id;
  section.innerHTML = `<h2>${domain.title}</h2>`;

  domain.events.forEach((event) => {
    const { name, desc, dir } = event;
    const div = document.createElement("div");
    div.className = "event";

    const eventName = document.createElement("div");
    eventName.className = "event-name";
    eventName.textContent = name;

    if (dir) {
      const badge = document.createElement("span");
      badge.className = `event-dir ${dir}`;
      badge.textContent = dir === "in" ? "received" : dir === "out" ? "sent" : "system";
      eventName.appendChild(badge);
    }

    const eventDesc = document.createElement("div");
    eventDesc.className = "event-desc";
    eventDesc.textContent = desc;

    div.appendChild(eventName);
    div.appendChild(eventDesc);

    const payload = eventPayloads[name];
    if (payload) {
      const payloadBlock = document.createElement("pre");
      payloadBlock.className = "event-payload";
      payloadBlock.textContent = payload;
      div.appendChild(payloadBlock);
    }

    section.appendChild(div);
  });

  content.appendChild(section);
}
</script>
